<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول - Aisa&3QAB</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{dark:'#0a0a0a',blue:'#2563eb',red:'#dc2626'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="bg-dark text-white flex items-center justify-center min-h-screen">

<div class="bg-black/50 p-8 rounded-2xl border-blue/30 w-full max-w-md">
  <h1 class="text-3xl font-black text-center mb-8"><span class="text-blue">Aisa</span><span class="text-red">&3QAB</span></h1>
  
  <form id="loginForm">
    <input type="email" placeholder="الايميل" required class="w-full bg-dark border-gray-700 rounded-lg p-3 mb-4 focus:border-blue outline-none">
    <input type="password" placeholder="كلمة السر" required class="w-full bg-dark border-gray-700 rounded-lg p-3 mb-6 focus:border-blue outline-none">
    <button type="submit" class="w-full bg-gradient-to-r from-blue to-red py-3 rounded-lg font-bold hover:scale-105 transition">دخول</button>
  </form>
  
  <p class="text-center mt-4 text-gray-400">معندكش حساب؟ <a href="register.html" class="text-blue">سجل جديد</a></p>
</div>

<script>
document.getElementById('loginForm').onsubmit = (e) => {
  e.preventDefault();
  window.location.href = 'panel.html';
}
</script>
</body>
</html>
